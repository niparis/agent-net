<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1250" viewBox="0 0 1500 1250" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Agent network primitives and their relationships</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#8c959f"/></marker></defs><rect width="1500" height="1250" rx="14" fill="#f6f8fa"/><rect x="620" y="20" width="260" height="62" rx="10" fill="#ddf4ff" stroke="#0969da" stroke-width="1.3"/><text x="636" y="47" font-size="15" font-weight="700" fill="#1f2328">OWNER</text><text x="636" y="69" font-size="13" fill="#656d76">Source of authority</text><rect x="30" y="145" width="270" height="88" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.3"/><text x="46" y="172" font-size="15" font-weight="700" fill="#1f2328">CHARTER</text><text x="46" y="194" font-size="13" fill="#656d76">goals and behavior</text><rect x="320" y="145" width="270" height="88" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.3"/><text x="336" y="172" font-size="15" font-weight="700" fill="#1f2328">AUTHORITY</text><text x="336" y="194" font-size="13" fill="#656d76">actions without asking</text><rect x="610" y="145" width="270" height="88" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.3"/><text x="626" y="172" font-size="15" font-weight="700" fill="#1f2328">AUTONOMY</text><text x="626" y="194" font-size="13" fill="#656d76">may wake itself</text><text x="626" y="213" font-size="13" fill="#656d76">may plan its own work</text><rect x="900" y="145" width="270" height="88" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.3"/><text x="916" y="172" font-size="15" font-weight="700" fill="#1f2328">NEEDS YOU</text><text x="916" y="194" font-size="13" fill="#656d76">attention queue</text><rect x="1190" y="145" width="270" height="88" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.3"/><text x="1206" y="172" font-size="15" font-weight="700" fill="#1f2328">BUDGET</text><text x="1206" y="194" font-size="13" fill="#656d76">quotas and protected providers</text><text x="1206" y="213" font-size="13" fill="#656d76">daily cap on automatic wake-ups</text><path d="M750 82 V110 H165 V145" fill="none" stroke="#8c959f" stroke-width="1.5" marker-end="url(#arrow)"/><text x="265" y="102" text-anchor="middle" font-size="12" fill="#656d76">sets</text><path d="M750 82 V110 H455 V145" fill="none" stroke="#8c959f" stroke-width="1.5" marker-end="url(#arrow)"/><text x="455" y="102" text-anchor="middle" font-size="12" fill="#656d76">sets</text><path d="M750 82 V110 H745 V145" fill="none" stroke="#8c959f" stroke-width="1.5" marker-end="url(#arrow)"/><text x="775" y="102" text-anchor="middle" font-size="12" fill="#656d76">sets</text><path d="M750 82 V110 H1035 V145" fill="none" stroke="#8c959f" stroke-width="1.5" marker-end="url(#arrow)"/><text x="1040" y="102" text-anchor="middle" font-size="12" fill="#656d76">attends to</text><path d="M750 82 V110 H1325 V145" fill="none" stroke="#8c959f" stroke-width="1.5" marker-end="url(#arrow)"/><text x="1230" y="102" text-anchor="middle" font-size="12" fill="#656d76">sets</text><rect x="320" y="340" width="520" height="130" rx="10" fill="#ddf4ff" stroke="#0969da" stroke-width="1.3"/><text x="336" y="367" font-size="15" font-weight="700" fill="#1f2328">AGENT</text><text x="336" y="389" font-size="13" fill="#656d76">Graph node: project lead / advisor / worker / ghost</text><text x="336" y="408" font-size="13" fill="#656d76">STATE: activity (session: busy/idle) + pending</text><text x="336" y="427" font-size="13" fill="#656d76">(has work left: yes/no/unknown)</text><rect x="920" y="355" width="250" height="100" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.3"/><text x="936" y="382" font-size="15" font-weight="700" fill="#1f2328">EDGE</text><text x="936" y="404" font-size="13" fill="#656d76">who may ask whom</text><text x="936" y="423" font-size="13" fill="#656d76">rule: auto / hold / ask   ·   trust</text><rect x="1250" y="370" width="210" height="70" rx="10" fill="#ddf4ff" stroke="#0969da" stroke-width="1.3"/><text x="1266" y="397" font-size="15" font-weight="700" fill="#1f2328">AGENT B</text><text x="1266" y="419" font-size="13" fill="#656d76">another Graph node</text><path d="M840 405 H920" fill="none" stroke="#8c959f" stroke-width="1.5" marker-end="url(#arrow)"/><text x="880" y="396" text-anchor="middle" font-size="12" fill="#656d76"></text><path d="M1170 405 H1250" fill="none" stroke="#8c959f" stroke-width="1.5" marker-end="url(#arrow)"/><text x="1210" y="395" text-anchor="middle" font-size="12" fill="#656d76">A to B</text><path d="M165 233 V285 H380 V340" fill="none" stroke="#8c959f" stroke-width="1.5" marker-end="url(#arrow)"/><text x="270" y="277" text-anchor="middle" font-size="12" fill="#656d76">defines</text><path d="M455 233 V340" fill="none" stroke="#8c959f" stroke-width="1.5" marker-end="url(#arrow)"/><text x="477" y="290" text-anchor="middle" font-size="12" fill="#656d76">limits</text><path d="M745 233 V340" fill="none" stroke="#8c959f" stroke-width="1.5" marker-end="url(#arrow)"/><text x="775" y="290" text-anchor="middle" font-size="12" fill="#656d76">governs</text><path d="M810 340 V300 H1035 V233" fill="none" stroke="#8c959f" stroke-width="1.5" marker-end="url(#arrow)"/><text x="950" y="292" text-anchor="middle" font-size="12" fill="#656d76">asks</text><rect x="30" y="580" width="300" height="75" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.3"/><text x="46" y="607" font-size="15" font-weight="700" fill="#1f2328">SESSION</text><text x="46" y="629" font-size="13" fill="#656d76">1 = agent; 2+ = clones</text><rect x="30" y="730" width="300" height="75" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.3"/><text x="46" y="757" font-size="15" font-weight="700" fill="#1f2328">MACHINE / HARNESS / MODEL</text><text x="46" y="779" font-size="13" fill="#656d76">session attributes</text><path d="M380 470 V525 H180 V580" fill="none" stroke="#8c959f" stroke-width="1.5" marker-end="url(#arrow)"/><text x="270" y="517" text-anchor="middle" font-size="12" fill="#656d76">lives as</text><path d="M180 655 V730" fill="none" stroke="#8c959f" stroke-width="1.5" marker-end="url(#arrow)"/><text x="210" y="696" text-anchor="middle" font-size="12" fill="#656d76">runs on</text><rect x="420" y="580" width="250" height="75" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.3"/><text x="436" y="607" font-size="15" font-weight="700" fill="#1f2328">PROJECT</text><text x="436" y="629" font-size="13" fill="#656d76">home of a lead</text><rect x="420" y="730" width="250" height="75" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.3"/><text x="436" y="757" font-size="15" font-weight="700" fill="#1f2328">WORKSPACE</text><text x="436" y="779" font-size="13" fill="#656d76">folder or worktree</text><path d="M545 470 V580" fill="none" stroke="#8c959f" stroke-width="1.5" marker-end="url(#arrow)"/><text x="580" y="529" text-anchor="middle" font-size="12" fill="#656d76">has home</text><path d="M545 655 V730" fill="none" stroke="#8c959f" stroke-width="1.5" marker-end="url(#arrow)"/><text x="576" y="696" text-anchor="middle" font-size="12" fill="#656d76">contains</text><rect x="760" y="580" width="300" height="75" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.3"/><text x="776" y="607" font-size="15" font-weight="700" fill="#1f2328">TOOLS</text><text x="776" y="629" font-size="13" fill="#656d76">skills and MCP</text><rect x="1110" y="580" width="350" height="75" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.3"/><text x="1126" y="607" font-size="15" font-weight="700" fill="#1f2328">KNOWLEDGE</text><text x="1126" y="629" font-size="13" fill="#656d76">playbooks and findings</text><rect x="760" y="730" width="300" height="88" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.3"/><text x="776" y="757" font-size="15" font-weight="700" fill="#1f2328">MESSAGE</text><text x="776" y="779" font-size="13" fill="#656d76">ask, reply, notification</text><text x="776" y="798" font-size="13" fill="#656d76">a request is a task</text><rect x="1110" y="730" width="350" height="75" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.3"/><text x="1126" y="757" font-size="15" font-weight="700" fill="#1f2328">NEEDS YOU ITEM</text><text x="1126" y="779" font-size="13" fill="#656d76">a task for the owner</text><text x="760" y="550" font-size="13" font-weight="700" fill="#656d76">SHARED ACROSS THE NETWORK</text><text x="30" y="880" font-size="13" font-weight="700" fill="#656d76">DELEGATED WORK</text><rect x="30" y="980" width="260" height="75" rx="10" fill="#ddf4ff" stroke="#0969da" stroke-width="1.3"/><text x="46" y="1007" font-size="15" font-weight="700" fill="#1f2328">REQUESTING AGENT</text><text x="46" y="1029" font-size="13" fill="#656d76">the agent above</text><rect x="400" y="980" width="220" height="75" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.3"/><text x="416" y="1007" font-size="15" font-weight="700" fill="#1f2328">WORKER</text><text x="416" y="1029" font-size="13" fill="#656d76">one-task agent</text><rect x="730" y="980" width="300" height="95" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.3"/><text x="746" y="1007" font-size="15" font-weight="700" fill="#1f2328">TASK</text><text x="746" y="1029" font-size="13" fill="#656d76">contract: caller, doer,</text><text x="746" y="1048" font-size="13" fill="#656d76">done condition, result</text><rect x="1140" y="980" width="260" height="75" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.3"/><text x="1156" y="1007" font-size="15" font-weight="700" fill="#1f2328">REPORT</text><text x="1156" y="1029" font-size="13" fill="#656d76">task result</text><path d="M290 1015 H400" fill="none" stroke="#8c959f" stroke-width="1.5" marker-end="url(#arrow)"/><text x="345" y="1005" text-anchor="middle" font-size="12" fill="#656d76">requests</text><path d="M620 1015 H730" fill="none" stroke="#8c959f" stroke-width="1.5" marker-end="url(#arrow)"/><text x="675" y="1005" text-anchor="middle" font-size="12" fill="#656d76">does</text><path d="M1030 1015 H1140" fill="none" stroke="#8c959f" stroke-width="1.5" marker-end="url(#arrow)"/><text x="1085" y="1005" text-anchor="middle" font-size="12" fill="#656d76">produces</text><path d="M1270 980 V925 H160 V980" fill="none" stroke="#8c959f" stroke-width="1.5" marker-end="url(#arrow)"/><text x="715" y="917" text-anchor="middle" font-size="12" fill="#656d76">returns to</text><path d="M1460 189 H1480 V1140 H510 V1055" fill="none" stroke="#8c959f" stroke-width="1.5" marker-end="url(#arrow)"/><text x="1150" y="1130" text-anchor="middle" font-size="12" fill="#656d76">caps worker and automatic wake-ups</text></svg>
