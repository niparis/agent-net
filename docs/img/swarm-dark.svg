      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-label="Left: a hive of agents packed around one task with crossing lines and conflicting choices, everything reaching you. Right: a supervised swarm, agents split into projects with leads, a few lines where work meets, one control space, and a funnel to two real decisions on your Desk.">
<style>
