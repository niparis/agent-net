format: 1
settings:
  - key: workers.sandbox_level
    rows: [52]
    description: How far a worker's permissions are limited.
    kind: rule
    type: enum
    values: [sandboxed, no-network, read-only]
    levels: [network, repo]
    default: sandboxed
    by_maturity: {critical: no-network}
    live: false
  - key: delivery.merge_authority
    rows: [128]
    description: Who may approve a merge.
    kind: rule
    type: enum
    values: [full, delegated, ask]
    levels: [network, repo]
    default: full
    by_maturity: {mature: delegated, critical: ask}
    live: false
  - key: workers.auto_continue
    rows: [64]
    description: Whether an early worker stop is continued automatically.
    kind: rule
    type: bool
    stricter: false
    levels: [network, run]
    default: true
    live: false
  - key: workers.auto_continue_max
    rows: [65]
    description: Maximum automatic continues after early worker stops.
    kind: rule
    type: int
    levels: [network]
    min: 0
    default: 2
    live: false
  - key: guidance.peer_help_direct
    rows: [3]
    description: Tells sessions to answer peers directly.
    kind: advice
    type: text
    levels: [network]
    slots: [reply]
    default: >-
      - **When another agent messages you, help it.** Answering a peer's
      question or request is part of your job. Reply directly {{reply}}. Do not
      wait for me to approve a normal answer.
    live: false
