name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-go@v5.5.0
        with:
          go-version-file: go.mod
      - name: reuse green CI
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url="$(gh api "repos/${{ github.repository }}/actions/runs?head_sha=${{ github.sha }}&per_page=100" \
            --jq '[.workflow_runs[] | select(.path == ".github/workflows/ci.yml" and .status == "completed" and .conclusion == "success")][0].html_url // empty')"
          if [ -n "$url" ]; then
            echo "CI passed on this commit: $url"
            echo "passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "no green CI run on this commit, running vet and the race tests here"
            echo "passed=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.ci.outputs.passed != 'true'
        run: go vet ./...
      - if: steps.ci.outputs.passed != 'true'
        run: go test -race ./...
      - name: build
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          pids=""
          failed=0
          for target in linux-amd64 linux-arm64 darwin-amd64 darwin-arm64; do
            os="${target%-*}"
            arch="${target#*-}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X main.version=${TAG}" \
              -o "dist/agent-net-$os-$arch" ./cmd/agent-net &
            pids="$pids $!"
          done
          for pid in $pids; do
            if ! wait "$pid"; then
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "one or more builds failed"
            exit 1
          fi
          cp install.sh dist/install.sh
          cd dist
          sha256sum agent-net-* > checksums.txt
          cat checksums.txt
      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --title "$TAG" --generate-notes \
            dist/agent-net-linux-amd64 dist/agent-net-linux-arm64 \
            dist/agent-net-darwin-amd64 dist/agent-net-darwin-arm64 \
            dist/checksums.txt dist/install.sh
