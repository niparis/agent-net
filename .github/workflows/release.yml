name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-go@v5.5.0
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...
      - name: build
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          for os in linux darwin; do
            for arch in amd64 arm64; do
              CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
                -ldflags "-s -w -X main.version=${TAG}" \
                -o "dist/agent-net-$os-$arch" ./cmd/agent-net
            done
          done
          cp install.sh dist/install.sh
          cd dist
          sha256sum agent-net-* > checksums.txt
          cat checksums.txt
      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --title "$TAG" --generate-notes \
            dist/agent-net-linux-amd64 dist/agent-net-linux-arm64 \
            dist/agent-net-darwin-amd64 dist/agent-net-darwin-arm64 \
            dist/checksums.txt dist/install.sh
