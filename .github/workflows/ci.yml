name: ci

on:
  push:
    branches:
      - "merge-**"
      - "agent-net/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Go toolchain location
        id: go
        run: |
          version="$(awk '$1 == "go" { print $2; exit }' go.mod)"
          case "$RUNNER_ARCH" in
            X64) arch=x64 ;;
            ARM64) arch=arm64 ;;
            *) echo "unsupported runner arch: $RUNNER_ARCH" >&2; exit 1 ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "dir=$RUNNER_TOOL_CACHE/go/$version/$arch" >> "$GITHUB_OUTPUT"
      # Restore the Go toolchain before setup-go runs. setup-go uses a toolchain
      # found in the tool cache and downloads one only when it is missing. On a
      # miss, setup-go downloads it as before and this cache saves it after a
      # successful job.
      - uses: actions/cache@v5.1.0
        with:
          path: |
            ${{ steps.go.outputs.dir }}
            ${{ steps.go.outputs.dir }}.complete
          key: go-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.version }}
      - uses: actions/setup-go@v5.5.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "gofmt needed on:"
            echo "$out"
            exit 1
          fi
      - run: go vet ./...
      - name: install.sh syntax
        run: sh -n install.sh
      - name: test script syntax
        run: bash -n scripts/test.sh
      - name: shard planner
        run: bash scripts/test-sharding.sh
      # The checkout is shallow and has no default branch. The lock check
      # compares the lock with origin/main, so fetch it here. A failed fetch
      # fails this step, so the check cannot pass by skipping.
      - name: migrations lock extends main
        run: |
          git fetch --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main
          go test -count=1 -v -run '^TestMigrationsLockExtendsBase$' ./internal/gateway

  test-sharded:
    name: ${{ matrix.package }} shard ${{ matrix.shard }} of 4
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [daemon, gateway, setup, tui, agent-net]
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Go toolchain location
        id: go
        run: |
          version="$(awk '$1 == "go" { print $2; exit }' go.mod)"
          case "$RUNNER_ARCH" in
            X64) arch=x64 ;;
            ARM64) arch=arm64 ;;
            *) echo "unsupported runner arch: $RUNNER_ARCH" >&2; exit 1 ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "dir=$RUNNER_TOOL_CACHE/go/$version/$arch" >> "$GITHUB_OUTPUT"
      # Restore the Go toolchain before setup-go runs. setup-go uses a toolchain
      # found in the tool cache and downloads one only when it is missing. On a
      # miss, setup-go downloads it as before and this cache saves it after a
      # successful job.
      - uses: actions/cache@v5.1.0
        with:
          path: |
            ${{ steps.go.outputs.dir }}
            ${{ steps.go.outputs.dir }}.complete
          key: go-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.version }}
      - uses: actions/setup-go@v5.5.0
        with:
          go-version-file: go.mod
      - run: scripts/test.sh --package ${{ matrix.package }} --shard-index ${{ matrix.shard }} --shard-count 4 -- -timeout 30m

  test-other:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Go toolchain location
        id: go
        run: |
          version="$(awk '$1 == "go" { print $2; exit }' go.mod)"
          case "$RUNNER_ARCH" in
            X64) arch=x64 ;;
            ARM64) arch=arm64 ;;
            *) echo "unsupported runner arch: $RUNNER_ARCH" >&2; exit 1 ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "dir=$RUNNER_TOOL_CACHE/go/$version/$arch" >> "$GITHUB_OUTPUT"
      # Restore the Go toolchain before setup-go runs. setup-go uses a toolchain
      # found in the tool cache and downloads one only when it is missing. On a
      # miss, setup-go downloads it as before and this cache saves it after a
      # successful job.
      - uses: actions/cache@v5.1.0
        with:
          path: |
            ${{ steps.go.outputs.dir }}
            ${{ steps.go.outputs.dir }}.complete
          key: go-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.version }}
      - uses: actions/setup-go@v5.5.0
        with:
          go-version-file: go.mod
      # The runner has no git identity. Keep it that way so a test that forgets
      # to set one fails here as it does on a fresh machine, not only in CI's
      # other jobs (scripts/test.sh sets the same environment).
      - name: other packages
        env:
          GIT_CONFIG_NOSYSTEM: "1"
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: user.useConfigOnly
          GIT_CONFIG_VALUE_0: "true"
        run: |
          unset EMAIL
          for name in $(env | sed -n 's/^\(GIT_AUTHOR_[^=]*\)=.*/\1/p;s/^\(GIT_COMMITTER_[^=]*\)=.*/\1/p'); do
            unset "$name"
          done
          go test -race -timeout 30m $(go list ./... | grep -v -e '/internal/daemon$' -e '/internal/gateway$' -e '/internal/setup$' -e '/internal/tui$' -e '/cmd/agent-net$')

  test-plugins:
    name: pi, opencode and claude plugins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22.12.0
      - run: sh plugins/pi/test.sh
      - run: sh plugins/opencode/test.sh
      - run: sh plugins/claude/test-agent-net-workers.sh
