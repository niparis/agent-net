name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-go@v5.5.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "gofmt needed on:"
            echo "$out"
            exit 1
          fi
      - run: go vet ./...
      - name: install.sh syntax
        run: sh -n install.sh
      - name: test script syntax
        run: bash -n scripts/test.sh

  test-daemon:
    name: daemon shard ${{ matrix.shard }} of 4
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-go@v5.5.0
        with:
          go-version-file: go.mod
      - run: scripts/test.sh --shard-index ${{ matrix.shard }} --shard-count 4 -- -timeout 30m

  test-other:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-go@v5.5.0
        with:
          go-version-file: go.mod
      - run: go test -race -timeout 30m $(go list ./... | grep -v /internal/daemon)

  test-plugins:
    name: pi and opencode plugins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22.12.0
      - run: sh plugins/pi/test.sh
      - run: sh plugins/opencode/test.sh
