name: pages

# Publishes install.sh at https://niparis.github.io/agent-net/install
# (and /install.sh) so the first install is one short line.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Go toolchain location
        id: go
        run: |
          version="$(awk '$1 == "go" { print $2; exit }' go.mod)"
          case "$RUNNER_ARCH" in
            X64) arch=x64 ;;
            ARM64) arch=arm64 ;;
            *) echo "unsupported runner arch: $RUNNER_ARCH" >&2; exit 1 ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "dir=$RUNNER_TOOL_CACHE/go/$version/$arch" >> "$GITHUB_OUTPUT"
      # Restore the Go toolchain before setup-go runs. setup-go uses a toolchain
      # found in the tool cache and downloads one only when it is missing. On a
      # miss, setup-go downloads it as before and this cache saves it after a
      # successful job.
      - uses: actions/cache@v5.1.0
        with:
          path: |
            ${{ steps.go.outputs.dir }}
            ${{ steps.go.outputs.dir }}.complete
          key: go-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.version }}
      - uses: actions/setup-go@v5.5.0
        with:
          go-version-file: go.mod
      - name: Download the latest release installer and signatures
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release
          gh release download --repo "${{ github.repository }}" --dir release \
            --pattern install.sh --pattern checksums.txt \
            --pattern checksums.txt.sig --pattern checksums.txt.sshsig
      - name: Verify release installer
        run: |
          go run ./scripts/release-key verify release/checksums.txt release/install.sh
          sh -n release/install.sh
      - name: Build site
        run: |
          mkdir -p site
          cp release/install.sh site/install
          cp release/install.sh site/install.sh
          touch site/.nojekyll
          cat > site/index.html <<'EOF'
          <!doctype html>
          <meta charset="utf-8">
          <title>agent-net</title>
          <meta http-equiv="refresh" content="0; url=https://github.com/niparis/agent-net">
          <a href="https://github.com/niparis/agent-net">github.com/niparis/agent-net</a>
          EOF
      - uses: actions/configure-pages@v5.0.0
      - uses: actions/upload-pages-artifact@v3.0.1
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4.0.5
